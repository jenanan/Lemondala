<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lemondala</title>

    <link rel="stylesheet" href="lemon-tree.css">
</head>

<body>

    <nav class="transform-nav">
        <a href="../../View/">← VIEW</a>
        <a href="../../Spread/">SPREAD →</a>
    </nav>

    <main class="game">

        <section class="tree-area">

            <div class="game-layout">

                <!-- LEFT: TREE -->
                <section class="tree-panel">
                    <div class="tree"></div>
                </section>


                <!-- RIGHT: CARDS -->
                <section class="card-area">

                    <div class="deck"></div>

                    <div class="drawn-cards">
                        <button class="card"></button>
                        <button class="card"></button>
                    </div>

                </section>

            </div>

        </section>

    </main>


    <div class="end-modal" id="endModal">

        <div class="end-modal-content">

            <p>TRANSFORM complete.</p>
            <p>Rest and reset.</p>
            <p>The cycle continues.</p>

            <button id="resetGame">RESET</button>

            <p>For another interactive</p>
            <p>experience try</p>

            <a href="../lemon-sunflower/" class="next-transform">
            LEMON SUNFLOWER
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
