<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lemondala</title>

    <link rel="stylesheet" href="dive.css">
</head>

<body>

    <nav class="transform-nav">
        <a href="../../View/">← VIEW</a>
        <a href="../../Spread/">SPREAD →</a>
    </nav>


    <main class="dive-transform">

        <div class="dive-layout">

            <!-- LEFT: DIVE IMAGE -->
            <section class="dive-panel">

                <div class="dive"></div>

            </section>


            <!-- RIGHT: INTERACTION -->
            <section class="dive-controls">

                <div
                    class="choice-area"
                    id="choiceArea"
                >
                    <!-- Character controls will go here -->
                </div>

            </section>

        </div>

    </main>


    <!-- COMPLETION MODAL -->
    <div class="end-modal" id="endModal">

        <div class="end-modal-content">

            <p>TRANSFORM complete.</p>
            <p>Rest and reset.</p>
            <p>The cycle continues.</p>

            <button id="resetDive">
                RESET
            </button>

            <div class="more-experiences">

                <p>For more interactive</p>
                <p>experiences try</p>

                <div class="experience-buttons">

                    <a
                        href="../lemon-tree/"
                        class="next-transform"
                    >
                        THRIVE
                    </a>

                    <a
                        href="../lemon-sunflower/"
                        class="next-transform"
                    >
                        BLOOM
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
