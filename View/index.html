<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Animations of the world of Lemondala.">
    <title>View | Lemondala</title>

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../View/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" href="/favicon.png">
</head>

<!-- Site Header -->
<header class="site-header">

    <div class="brand">

        <a href="https://lemondala.com" class="logo">
            LEMONDALA
        </a>

    <nav class="site-nav">
        <a href="../View/" class="active">VIEW</a>
        <a href="../Transform/" class="active">TRANSFORM</a>
        <a href="../Spread/" class="active">SPREAD</a>
    </nav>

    </div>

</header>

<body>
    <main class="view-page">
        <section class="image-gallery" aria-label="Lemondala visual works">

            <button class="artwork-trigger" type="button" data-gif="GIFs/2.gif" aria-label="Play animation of the lemon shark">
            <img src="../Assets/images/2.png" alt="Conceptual collage of a lemon combined with a shark head, torn fish tail, and human arms with fists."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/25.Lemon_Sunflower_multicolored_petals.gif" aria-label="Play animation of the multicolored petals lemon sunflower">
            <img src="../Assets/images/25-multicolored-petals.png" alt="Lemon sunflower with multicolored petals."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/4.gif" aria-label="Play animation of dance battle lemons">
            <img src="../Assets/images/4.png" alt="Lemon dance battle. Conceptual collate of two lemons with with human legs, one wearing a conical hat and the other wearing a Viking helmet."></button>
            
            <div class="skit-link">

                <a class="skit-image"
                    href="https://www.facebook.com/share/v/1C8frBrmDP/"
                    target="_blank"
                    rel="noopener noreferrer">

                    <img src="skits/art/butterfly_poop.png"
                        alt="Butterfly Poo Lemondala skit">
                </a>

            <div class="skit-teaser">
                <h2>BUTTERFLY POOP</h2>

                <p>Aqua Horns gets the dirty end of the deal after Wizard Lemon and Sword Lemon decide to battle.</p>

                <a href="https://www.facebook.com/share/v/1C8frBrmDP/"
                    target="_blank"
                    rel="noopener noreferrer">
                    WATCH →
                    </a>
            </div>

            </div>

            <button class="artwork-trigger" type="button" data-gif="GIFs/6.gif" aria-label="Play animation of the lemon with the pink bra">
            <img src="../Assets/images/6.png" alt="Lemon wearing a pink bra against a white background."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/9.gif" aria-label="Play animation of lemon spraying">
            <img src="../Assets/images/9.png" alt="Two lemons. The right lemon sprays a golden liquid stream at the other."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/10.gif" aria-label="Play animation of the grater explosion">
            <img src="../Assets/images/10.png" alt="A lemon faces a tilted box grater balanced on a lit red explosive."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/5.gif" aria-label="Play animation of the pink lemon sunflower">
            <img src="../Assets/images/5.png" alt="A sunflower with a lemon center and pink petals."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/12.gif" aria-label="Play animation of the lemon with hat and dog legs">
            <img src="../Assets/images/12.png" alt="A lemon with a hat and dog legs."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/13.gif" aria-label="Play animation of the lemon eating small lemons from pill bottle">
            <img src="../Assets/images/13.png" alt="A lemon stands next to a pill bottle full of mini lemons."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/15.gif" aria-label="Play animation of the lemon spraying the eyeball">
            <img src="../Assets/images/15.png" alt="A lemon on the right and an eyeball on the left. The lemon sprays juice on the eyeball."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/16.gif" aria-label="Play animation of the lemon sucking the cactus gone">
            <img src="../Assets/images/16.png" alt="A lemon on the right and an cactus with a yellow flower on the left. A blue straw sticks out from the cactus."></button>
            
            <button class="artwork-trigger" type="button" data-gif="GIFs/17.gif" aria-label="Play animation of the lemon spraying on the candle">
            <img src="../Assets/images/17.png" alt="A lemon on a blue cupcake with a candle and a lemon on a red cupcake spraying juice onto the candle."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/18.gif" aria-label="Play animation of the lemon and salt shaker in the boat">
            <img src="../Assets/images/18.png" alt="A lemon with a black eyepatch. A salt shaker with chain around it attached to boat wheel. They are on a boat on water."></button>
            
            <button class="artwork-trigger" type="button" data-gif="GIFs/19.gif" aria-label="Play animation of the lemon throwing flame at ice cube">
            <img src="../Assets/images/19.png" alt="A lemon throws a flame at an ice cube."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/20.gif" aria-label="Play animation of the lemon and fire extinguisher and blue cupcake">
            <img src="../Assets/images/20.png" alt="A lemon extinguishes a candle."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/21.gif" aria-label="Play animation of the lemon catching the canvas on fire">
            <img src="../Assets/images/21.png" alt="The blue cupcake lemon uses the candle to set a canvas on fire."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/23.gif" aria-label="Play animation of the red cupcake lemon throwing fire at aqua antlers">
            <img src="../Assets/images/23.png" alt="The red cupcake lemon uses a flame to thwart the hungry aqua horned lemon."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/26.Green_horns_with_flowers_chased_by_blue_horns.gif" aria-label="Play animation of the green horns gathering flowers">
            <img src="../Assets/images/26.png" alt="The green horns gathers flowers for blue antlers who doesn't like that."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/27.Viking_Helmet_Lemon_Dance_1.gif" aria-label="Play animation of the viking helmet lemon dancing">
            <img src="../Assets/images/27.png" alt="Viking helmet lemon does a colorful dance."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/28.gif" aria-label="Play animation of the purple horns lemon and the butterfly">
            <img src="../Assets/images/28.png" alt="Purple horns lemon and butterfly and rain clouds and umbrella."></button>

            <button class="artwork-trigger" type="button" data-gif="GIFs/24.gif" aria-label="Play animation of the wizard and the wand">
            <img src="../Assets/images/24.png" alt="Lemon with a wizard hat and wand and a lemon with a sword."></button>

        </section>
    </main>

<div
    class="gif-modal"
    id="gif-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Animated artwork"
    hidden
>
    <button
        class="modal-close"
        id="modal-close"
        type="button"
        aria-label="Close animation"
    >
        ×
    </button>

    <img id="modal-gif" draggable="false" src="" alt="">
</div>

<script src="view.js"></script>

<footer class="site-footer">

    <a href="https://www.facebook.com/lemondala"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Visit Lemondala on Facebook">

        <i class="fa-brands fa-facebook"></i>

    </a>

    <p>© 2026 Lemondala</p>

</footer>

</body>
</html>
